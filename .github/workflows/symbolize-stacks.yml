name: Symbolize nabu user stacks against iPadOS 17.7 (21H16) dyld shared cache

on:
  push:
    paths:
      - symbolize/request.txt
      - symbolize/strings.txt

permissions:
  contents: read

jobs:
  symbolize:
    # macOS mounts the APFS system image natively (no apfs-fuse, no apt).
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install ipsw
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          gh release view --repo blacktop/ipsw --json assets --jq '.assets[].name' | tee /tmp/assets.txt
          ASSET="$(grep -E '^ipsw_' /tmp/assets.txt | grep -iE 'macos|darwin' | grep -iE 'arm64|universal|all' | grep -iE '\.tar\.gz$' | grep -viE 'extras|sbom|\.sig' | head -1)"
          test -n "$ASSET"
          mkdir -p /tmp/ipsw
          gh release download --repo blacktop/ipsw --pattern "$ASSET" --dir /tmp/ipsw
          tar -xzf "/tmp/ipsw/$ASSET" -C /tmp/ipsw
          sudo install -m 0755 "$(find /tmp/ipsw -type f -name ipsw | head -1)" /usr/local/bin/ipsw
          ipsw version
      - name: Fetch the iPadOS 17.7 21H16 IPSW for iPad7,11 and extract its dyld shared cache
        run: |
          set -euxo pipefail
          mkdir -p dsc ipswfile
          curl -fsSL https://api.ipsw.me/v4/ipsw/iPad7,11/21H16 -o meta.json
          cat meta.json
          URL="$(python3 -c 'import json;print(json.load(open("meta.json"))["url"])')"
          SHA1="$(python3 -c 'import json;print(json.load(open("meta.json"))["sha1sum"])')"
          curl -fL --retry 5 --retry-delay 10 -o ipswfile/fw.ipsw "$URL"
          echo "$SHA1  ipswfile/fw.ipsw" | shasum -a 1 -c -
          ipsw extract --dyld --output dsc ipswfile/fw.ipsw
          find dsc -type f | head -50
          du -sh dsc
      - name: Inspect launchd jobs named in symbolize/inspect.txt
        if: hashFiles('symbolize/inspect.txt') != ''
        run: |
          set -uxo pipefail
          mkdir -p out/launchd
          PAT="$(grep -v '^#' symbolize/inspect.txt | paste -sd'|' -)"
          ipsw extract --files --pattern "(LaunchDaemons|LaunchAgents)/.*(${PAT}).*\.plist$" --output out/launchd ipswfile/fw.ipsw 2>&1 | tail -20 || true
          find out/launchd -name '*.plist' | while read -r f; do echo "== $f"; plutil -p "$f"; done | tee out/launchd-jobs.txt
      - name: Dump the original iPad7,11 device tree (product, buttons, chosen, root)
        run: |
          set -uxo pipefail
          mkdir -p out/dt
          ipsw extract --dtree --output out/dt ipswfile/fw.ipsw 2>&1 | tail -5 || true
          find out/dt -type f | head
          for f in $(find out/dt -type f -iname '*j171*' -o -type f -iname '*j172*' | head -4); do
            echo "== $f"; ipsw dtree --json "$f" > "$f.json" 2>/dev/null || true
            python3 ci/dump_dt_json.py "$f.json" || true
          done 2>&1 | tee out/dt-summary.txt
      - name: Measure /private/var/staged_system_apps of 21H16
        run: |
          set -uxo pipefail
          mkdir -p out/staged
          ipsw extract --files --pattern 'private/var/staged_system_apps/.*' --output out/staged ipswfile/fw.ipsw 2>&1 | tail -3 || true
          { du -sh out/staged; find out/staged -maxdepth 6 -name '*.app' -type d | sed 's#.*/##' | sort | uniq; \
            find out/staged -maxdepth 6 -name '*.app' -type d -exec du -sk {} + | sort -n | tail -40; \
            echo files $(find out/staged -type f | wc -l) dirs $(find out/staged -type d | wc -l); } 2>&1 | tee out/staged-size.txt
          rm -rf out/staged
      - name: Symbolize
        run: |
          set -euo pipefail
          DSC="$(find dsc -type f -name 'dyld_shared_cache_arm64*' ! -name '*.*' | head -1)"
          echo "cache: $DSC"
          mkdir -p out
          ipsw dyld info "$DSC" 2>&1 | head -30 | tee out/cache-info.txt
          # request.txt: "<slide-hex> <addr-hex> [label]" per line; '#' comments
          while read -r slide addr label; do
            case "$slide" in ''|\#*) continue;; esac
            un="$(printf '0x%x' $(( 0x${addr#0x} - 0x${slide#0x} )))"
            sym="$(ipsw dyld a2s "$DSC" "$un" 2>&1 | tail -2 | tr '\n' ' ')"
            printf '%s %s %s => %s\n' "$addr" "$un" "${label:-}" "$sym" | tee -a out/symbols.txt
            case "${label:-}" in D:*)
              start="$(printf '0x%x' $(( un - 0x80 )))"
              { echo "== disass $label $start"; ipsw dyld disass "$DSC" --vaddr "$start" --count 64 2>&1 | tail -70; } | tee -a out/disass.txt || true;;
            esac
          done < symbolize/request.txt
      - name: Locate strings and OpenGL ES renderer bundles
        if: always()
        run: |
          set -uxo pipefail
          DSC="$(find dsc -type f -name 'dyld_shared_cache_arm64*' ! -name '*.*' | head -1)"
          mkdir -p out/gl
          if [ -f symbolize/strings.txt ]; then
            grep -v '^#' symbolize/strings.txt | while read -r str; do
              [ -n "$str" ] || continue
              { echo "== str $str"; timeout 600 ipsw dyld str "$DSC" "$str" 2>&1 | grep -v 'parsing\|objc\|symbol cache' | head -40; } | tee -a out/strings.txt
            done
          fi
          ipsw extract --files --pattern '(OpenGLES\.framework|GLEngine|GLRenderer|AppleMetalOpenGLRenderer|libGLProgrammability|libGLImage|libCoreVMClient).*' --output out/gl ipswfile/fw.ipsw 2>&1 | tail -5 || true
          find out/gl -type f | sed 's#^out/gl/##' | sort | tee out/gl-files.txt
          find out/gl -name Info.plist -exec plutil -p {} \; 2>&1 | head -200 | tee out/gl-plists.txt
          rm -rf out/gl
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nabu-stack-symbols
          path: out/
          retention-days: 7
