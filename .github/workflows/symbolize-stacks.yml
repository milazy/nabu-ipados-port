name: Symbolize nabu user stacks against iPadOS 17.7 (21H16) dyld shared cache

on:
  push:
    paths:
      - symbolize/request.txt

permissions:
  contents: read

jobs:
  symbolize:
    # macOS mounts the APFS system image natively (no apfs-fuse, no apt).
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install ipsw
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          gh release view --repo blacktop/ipsw --json assets --jq '.assets[].name' | tee /tmp/assets.txt
          ASSET="$(grep -E '^ipsw_' /tmp/assets.txt | grep -iE 'macos|darwin' | grep -iE 'arm64|universal|all' | grep -iE '\.tar\.gz$' | grep -viE 'extras|sbom|\.sig' | head -1)"
          test -n "$ASSET"
          mkdir -p /tmp/ipsw
          gh release download --repo blacktop/ipsw --pattern "$ASSET" --dir /tmp/ipsw
          tar -xzf "/tmp/ipsw/$ASSET" -C /tmp/ipsw
          sudo install -m 0755 "$(find /tmp/ipsw -type f -name ipsw | head -1)" /usr/local/bin/ipsw
          ipsw version
      - name: Fetch the iPadOS 17.7 21H16 IPSW for iPad7,11 and extract its dyld shared cache
        run: |
          set -euxo pipefail
          mkdir -p dsc ipswfile
          curl -fsSL https://api.ipsw.me/v4/ipsw/iPad7,11/21H16 -o meta.json
          cat meta.json
          URL="$(python3 -c 'import json;print(json.load(open("meta.json"))["url"])')"
          SHA1="$(python3 -c 'import json;print(json.load(open("meta.json"))["sha1sum"])')"
          curl -fL --retry 5 --retry-delay 10 -o ipswfile/fw.ipsw "$URL"
          echo "$SHA1  ipswfile/fw.ipsw" | shasum -a 1 -c -
          ipsw extract --dyld --output dsc ipswfile/fw.ipsw
          find dsc -type f | head -50
          du -sh dsc
      - name: Inspect launchd jobs named in symbolize/inspect.txt
        if: hashFiles('symbolize/inspect.txt') != ''
        run: |
          set -uxo pipefail
          mkdir -p out/launchd
          PAT="$(grep -v '^#' symbolize/inspect.txt | paste -sd'|' -)"
          ipsw extract --files --pattern "(LaunchDaemons|LaunchAgents)/.*(${PAT}).*\.plist$" --output out/launchd ipswfile/fw.ipsw 2>&1 | tail -20 || true
          find out/launchd -name '*.plist' | while read -r f; do echo "== $f"; plutil -p "$f"; done | tee out/launchd-jobs.txt
      - name: Symbolize
        run: |
          set -euo pipefail
          DSC="$(find dsc -type f -name 'dyld_shared_cache_arm64*' ! -name '*.*' | head -1)"
          echo "cache: $DSC"
          mkdir -p out
          ipsw dyld info "$DSC" 2>&1 | head -30 | tee out/cache-info.txt
          # request.txt: "<slide-hex> <addr-hex> [label]" per line; '#' comments
          while read -r slide addr label; do
            case "$slide" in ''|\#*) continue;; esac
            un="$(printf '0x%x' $(( 0x${addr#0x} - 0x${slide#0x} )))"
            sym="$(ipsw dyld a2s "$DSC" "$un" 2>&1 | tail -2 | tr '\n' ' ')"
            printf '%s %s %s => %s\n' "$addr" "$un" "${label:-}" "$sym" | tee -a out/symbols.txt
          done < symbolize/request.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nabu-stack-symbols
          path: out/
          retention-days: 7
