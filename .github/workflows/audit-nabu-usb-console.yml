name: Audit nabu USB console models (no device access)
on:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  usb-models:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install host model dependencies
        run: |
          set -euxo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends clang llvm
          python3 -m pip install --disable-pip-version-check pillow
      - name: Fetch exact published nabu USB source
        run: |
          set -euxo pipefail
          git init -q usb-source
          git -C usb-source remote add origin https://github.com/Lux12138/nabu-usb-cdc.git
          git -C usb-source fetch --quiet --depth 1 origin 6c3930b746ab316fbf3bd86c1795a4338ab4f589
          git -C usb-source checkout --quiet --detach FETCH_HEAD
          test "$(git -C usb-source rev-parse HEAD)" = 6c3930b746ab316fbf3bd86c1795a4338ab4f589
      - name: Run real USB controller and SM8150 models
        run: |
          set -euxo pipefail
          python3 -B usb-source/module/tests/check.py --target-clang "$(command -v clang)" --output "$RUNNER_TEMP/tmp/nabu-usb-models"
          python3 - <<'PY'
          import json, os, pathlib
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/'tmp/nabu-usb-models/check-report.json'
          report=json.loads(p.read_text())
          assert report['hardware_verified'] is False
          for key in ('generic-dwc3','sm8150-prepare','sm8150-domain','sm8150-control','native-screenshot-control'):
              assert key in report['checks'], key
          print('HOST MODELS ONLY:',len(report['checks']),'checks; kernel link and hardware remain unverified')
          PY
      - name: Preserve host-only audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nabu-usb-console-host-models
          path: ${{ runner.temp }}/tmp/nabu-usb-models
          retention-days: 7
          if-no-files-found: warn
