name: Build nabu owner-verified XNU UFS root (macOS)

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-nabu-ufs-owner-root.yml"

permissions:
  contents: read

concurrency:
  group: nabu-ufs-owner-root
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-26-intel
    timeout-minutes: 45
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
      HOMEBREW_NO_ENV_HINTS: "1"
      UNIXNU_DEVICE: ${{ github.workspace }}/nabu-stage
      UNIXNU_IPSW: ${{ github.workspace }}/ipsw-21h16-small.zip
    steps:
      - name: Checkout private build scripts only
        uses: actions/checkout@v4

      - name: Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Check Xcode and install dependencies
        run: |
          set -euxo pipefail
          if [ -d /Applications/Xcode_26.6.app/Contents/Developer ]; then
            echo "DEVELOPER_DIR=/Applications/Xcode_26.6.app/Contents/Developer" >> "$GITHUB_ENV"
            export DEVELOPER_DIR=/Applications/Xcode_26.6.app/Contents/Developer
          fi
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          brew install llvm lld mtools dtc unifdef

      - name: Fetch pinned public UniXNU sources
        run: |
          set -euxo pipefail
          git init -q nabu-source
          git -C nabu-source remote add origin https://github.com/zzweiqing/UniXNU-nabu.git
          git -C nabu-source fetch --quiet --depth 1 origin 54b4f98457f8e9e232cc0a077c20d08d0b2f0ac9
          git -C nabu-source checkout --quiet --detach FETCH_HEAD
          test "$(git -C nabu-source rev-parse HEAD)" = "54b4f98457f8e9e232cc0a077c20d08d0b2f0ac9"
          python3 - <<'PY'
          import json
          lock=json.load(open('ci/research_sources.lock.json'))
          nabu=next(x for x in lock['sources'] if x['slug']=='nabu')
          assert nabu['sha']=='54b4f98457f8e9e232cc0a077c20d08d0b2f0ac9'
          assert lock['target']['apple_build']=='21H16'
          PY
          git init -q unixnu
          git -C unixnu remote add origin https://github.com/UniXNU/UniXNU.git
          git -C unixnu fetch --quiet --depth 1 origin 245aca1a9ec5b730b1cad80fade295800d2981f1
          git -C unixnu checkout --quiet --detach FETCH_HEAD
          test "$(git -C unixnu rev-parse HEAD)" = "245aca1a9ec5b730b1cad80fade295800d2981f1"
          test -f nabu-source/source-ci/board-baseline.toml
          mkdir -p nabu-stage output
          cp nabu-source/source-ci/board-baseline.toml nabu-stage/board.toml
          for entry in configs scripts patches platform ufs gpu usb userprobe vendor; do
            if [ -e "nabu-source/$entry" ]; then cp -a "nabu-source/$entry" "nabu-stage/$entry"; fi
          done
          # Owner-verified root REQUIRES both OS and SystemOS trust-cache support.
          # Keep second static trust-cache patch in this profile; rebase its context below.

      - name: Fetch original Apple iPadOS 17.7 build inputs
        run: |
          set -euxo pipefail
          python3 ci/download_ipados_inputs.py
          test -s "$UNIXNU_IPSW"
          unzip -t "$UNIXNU_IPSW" > /dev/null
          shasum -a 256 "$UNIXNU_IPSW" | tee output/ipsw-input-sha256.txt

      - name: Fetch private signed OS and SystemOS hash policies
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          mkdir -p owner-input/os owner-input/systemos
          gh release download owner-hash-policies-20261106 \
            --repo giacomomilanesi/nabu-ipados-macos-build \
            --pattern '*-policy.tar.gz' --dir owner-input
          echo '762b971b49462cbaa99c0449a20a83edb9bbeec5bdbf07fbb07e6c3a2f9c5c14  owner-input/os-policy.tar.gz' | shasum -a 256 -c -
          echo '2fe6f4806ad4cb7a663321e0df781779cfbc825e296da88ecf26f5ebf8ee7b45  owner-input/systemos-policy.tar.gz' | shasum -a 256 -c -
          tar -xzf owner-input/os-policy.tar.gz -C owner-input/os
          tar -xzf owner-input/systemos-policy.tar.gz -C owner-input/systemos
          test -s owner-input/os/manifest.bin
          test -s owner-input/systemos/manifest.bin
          test -s owner-input/os/trusted-key.bin
          cmp owner-input/os/trusted-key.bin owner-input/systemos/trusted-key.bin
          test ! -e owner-input/os/private.pem
          test ! -e owner-input/systemos/private.pem
          echo "UNIXNU_OWNER_POLICY=$GITHUB_WORKSPACE/owner-input/os" >> "$GITHUB_ENV"
          echo "UNIXNU_OWNER_POLICY_SYSTEMOS=$GITHUB_WORKSPACE/owner-input/systemos" >> "$GITHUB_ENV"
          echo 'OWNER_PUBLIC_TRUST_INPUTS_VERIFIED=true'

      - name: Apply nabu source preparation and patches
        id: prep
        run: |
          set -euxo pipefail
          python3 nabu-source/source-ci/prepare_source.py \
            --upstream "$GITHUB_WORKSPACE/unixnu" \
            --device "$UNIXNU_DEVICE" \
            --profile nabu_ufs_root_defconfig \
            --report "$GITHUB_WORKSPACE/output/source-prepare.json"
          # Full owner-root must enable the *second* Apple static trust cache.
          # Rebase only the reviewed hunk onto this pinned XNU revision.
          python3 ci/rebase_owner_trust_patch.py \
            --patch "$UNIXNU_DEVICE/patches/xnu/nabu-master-second-trust-cache.patch"
          python3 ci/merge_xnu_patches.py \
            --upstream "$GITHUB_WORKSPACE/unixnu/patches/xnu" \
            --device "$UNIXNU_DEVICE/patches/xnu" \
            --report "$GITHUB_WORKSPACE/output/xnu-patch-manifest.json" \
            --owner-root

      - name: Compile owner-verified UFS XNU kernel with Xcode
        id: kernel
        run: |
          set -euxo pipefail
          cd unixnu
          ./unixnu defconfig nabu_ufs_root_defconfig -D "$UNIXNU_DEVICE"
          ./unixnu build kernel --ipsw "$UNIXNU_IPSW" 2>&1 | tee "$GITHUB_WORKSPACE/output/kernel-build.log"

      - name: Verify ARM64 Mach-O identity (not boot certification)
        run: |
          set -euxo pipefail
          python3 ci/verify_xnu_macho.py \
            --input unixnu/out/nabu/kernel/kernel.macho \
            --report output/kernel-identity.json

      - name: Preserve detailed XNU build logs
        if: always()
        run: |
          set -eu
          mkdir -p output/xnu-logs
          if [ -d unixnu/out/nabu/logs ]; then
            find unixnu/out/nabu/logs -maxdepth 2 -type f -name '*.log' -exec cp -v {} output/xnu-logs/ \;
          fi
          if [ -f output/xnu-logs/kernel-bootstrap.log ]; then
            echo "==== XNU error/context summary ===="
            grep -n -E -m 35 'error:|fatal error:|Error [0-9]+|FAILED|No rule to make|No such file' output/xnu-logs/kernel-bootstrap.log || true
            echo "==== XNU last 130 lines ===="
            tail -n 130 output/xnu-logs/kernel-bootstrap.log
          fi

      - name: Collect evidence without device installation
        if: always()
        env:
          BUILD_OUTCOME: ${{ steps.kernel.outcome }}
        run: |
          set -e
          python3 - <<'PY'
          import json, pathlib, os
          p=pathlib.Path('output/host-check.json')
          p.parent.mkdir(exist_ok=True)
          p.write_text(json.dumps({
            "profile":"nabu_ufs_root_defconfig",
            "source_commit":"245aca1a9ec5b730b1cad80fade295800d2981f1",
            "macos_runner":os.getenv("RUNNER_OS"),
            "kernel_build_outcome":os.getenv("BUILD_OUTCOME"),
            "not_boot_qualified":True,
            "source_nabu_pin":"54b4f98457f8e9e232cc0a077c20d08d0b2f0ac9",
            "full_os_and_systemos_images_present":False,
            "physical_120hz_qualified":False,
            "apple_services_qualified":False,
            "ready_to_flash":False,
            "owner_second_trust_cache_required":True,
            "no_tablet_connected":True,
            "no_flash_commands":True
          },indent=2))
          PY
          if [ -f output/source-prepare.json ] && [ -d unixnu/out/nabu ]; then
            sha=$(shasum -a 256 "$UNIXNU_IPSW" | cut -d ' ' -f 1)
            python3 nabu-source/source-ci/collect_outputs.py \
              --upstream "$GITHUB_WORKSPACE/unixnu" --device "$UNIXNU_DEVICE" \
              --output output/source-candidate \
              --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" \
              --head-sha "$GITHUB_SHA" \
              --build-outcome "$BUILD_OUTCOME" \
              --input-sha256 "$sha" \
              --prepare-report output/source-prepare.json || true
          fi

      - name: Upload private logs and identity evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nabu-ufs-owner-root-evidence
          path: |
            output/host-check.json
            output/source-prepare.json
            output/xnu-patch-manifest.json
            output/kernel-identity.json
            output/kernel-build.log
            output/xnu-logs/
            output/ipsw-input-sha256.txt
            output/source-candidate/summary.json
          if-no-files-found: warn
          retention-days: 7

      - name: Upload private kernel candidate (not boot-qualified)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: nabu-ufs-owner-root-kernel-unqualified
          path: unixnu/out/nabu/kernel/kernel.macho
          if-no-files-found: warn
          retention-days: 7
