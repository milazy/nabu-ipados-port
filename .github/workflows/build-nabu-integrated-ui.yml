name: Build nabu integrated UI kernel (two-pass)

on:
  workflow_dispatch:
    inputs:
      metal_async_only:
        description: "Build and qualify the asynchronous Metal frontend repair without rebuilding XNU"
        type: boolean
        required: false
        default: false
      usb_audit_only:
        description: "Run the pinned USB host models without building or accessing a device"
        type: boolean
        required: false
        default: false
      reference_run:
        description: "Optional successful pass-one artifact run"
        required: false
        default: ""
      reference_sha256:
        description: "Required expected kernel SHA-256 when reusing pass one"
        required: false
        default: ""

permissions:
  contents: read
  actions: read

concurrency:
  group: nabu-integrated-ui
  cancel-in-progress: false

jobs:
  metal-runtime:
    if: inputs.metal_async_only && !inputs.usb_audit_only
    uses: ./.github/workflows/build-nabu-metal-async.yml
  usb-models:
    if: inputs.usb_audit_only && !inputs.metal_async_only
    uses: ./.github/workflows/audit-nabu-usb-console.yml
  build:
    if: ${{ !inputs.usb_audit_only && !inputs.metal_async_only }}
    runs-on: macos-26-intel
    timeout-minutes: 90
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
      HOMEBREW_NO_ENV_HINTS: "1"
      UNIXNU_IPSW: ${{ github.workspace }}/ipsw-21h16-small.zip
      NABU_SOURCE_SHA: "54b4f98457f8e9e232cc0a077c20d08d0b2f0ac9"
      UNIXNU_SOURCE_SHA: "245aca1a9ec5b730b1cad80fade295800d2981f1"

    steps:
      - name: Checkout private build helpers
        uses: actions/checkout@v4

      - name: Python and Xcode toolchain
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Verify Xcode and install host dependencies
        run: |
          set -euxo pipefail
          if [ -d /Applications/Xcode_26.6.app/Contents/Developer ]; then
            echo "DEVELOPER_DIR=/Applications/Xcode_26.6.app/Contents/Developer" >> "$GITHUB_ENV"
            export DEVELOPER_DIR=/Applications/Xcode_26.6.app/Contents/Developer
          fi
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          brew install llvm lld mtools dtc unifdef

      - name: Fetch exact current nabu source and two pinned UniXNU trees
        run: |
          set -euxo pipefail
          git init -q nabu-source
          git -C nabu-source remote add origin https://github.com/zzweiqing/UniXNU-nabu.git
          git -C nabu-source fetch --quiet --depth 1 origin "$NABU_SOURCE_SHA"
          git -C nabu-source checkout --quiet --detach FETCH_HEAD
          test "$(git -C nabu-source rev-parse HEAD)" = "$NABU_SOURCE_SHA"

          # The public nabu pin predates the working GOP VSYNC path. Apply the
          # fail-closed 21H16 port qualified against this exact kernelcache.
          git -C nabu-source apply --check "$GITHUB_WORKSPACE/ci/nabu-integrated-vsync-21h16.patch"
          git -C nabu-source apply "$GITHUB_WORKSPACE/ci/nabu-integrated-vsync-21h16.patch"
          git -C nabu-source apply --check "$GITHUB_WORKSPACE/ci/nabu-display-status-transport.patch"
          git -C nabu-source apply "$GITHUB_WORKSPACE/ci/nabu-display-status-transport.patch"
          git -C nabu-source apply --check "$GITHUB_WORKSPACE/ci/nabu-ui-writer-sampling.patch"
          git -C nabu-source apply "$GITHUB_WORKSPACE/ci/nabu-ui-writer-sampling.patch"
          python3 ci/apply_iomfb_compat.py --source nabu-source
          python3 ci/apply_iomfb_modes.py --source nabu-source
          python3 ci/apply_ui_stack_sampler.py --source nabu-source
          python3 ci/apply_ui_targets_chronod.py --source nabu-source
          python3 ci/apply_aks_keywrap.py --source nabu-source
          python3 ci/apply_disable_widget_daemons.py --source nabu-source
          python3 ci/apply_disable_iconservices.py --source nabu-source
          grep -F 'NABU_DISABLE_ICONSERVICES_V1' nabu-source/source-ci/nabu_data_skeleton.py
          python3 ci/apply_nabu_cpufreq.py --source nabu-source
          python3 ci/apply_nabu_gpu_dvfs.py --source nabu-source
          python3 ci/apply_frame_timing.py --source nabu-source
          grep -F 'NABU_FRAME_TIMING_V1' nabu-source/platform/NabuGpuScanoutHandoff.h
          grep -F 'NABU_GPU_DVFS_V1' nabu-source/gpu/a640/NativeAdrenoA6xxPower.cpp nabu-source/gpu/a640/NativeAdrenoA6xxGmu.cpp
          grep -F 'NABU_CPUFREQ_V1' nabu-source/scripts/nabu_ui_watch_source.py
          grep -F 'NABU_DISABLE_WIDGET_DAEMONS_V1' nabu-source/source-ci/nabu_data_skeleton.py
          grep -F 'NABU_AKS_KEYWRAP_V1' nabu-source/platform/NabuKeybagNotifications.cpp
          grep -F 'NABU_UI_STACK_V1' nabu-source/scripts/nabu_ui_watch_source.py
          grep -F 'NABU_UI_TARGETS_V2' nabu-source/scripts/nabu_ui_watch_source.py
          grep -F 'NABU DISPLAY iomfb-modes published' nabu-source/platform/NabuLegacyCpuPresent.cpp
          grep -F 'NABU DISPLAY iomfb-mode block=0x40' nabu-source/platform/NabuLegacyDisplayProbe.cpp
          python3 -m py_compile ci/apply_iomfb_compat.py ci/apply_iomfb_modes.py ci/apply_ui_stack_sampler.py ci/apply_ui_targets_chronod.py ci/apply_aks_keywrap.py ci/apply_disable_widget_daemons.py ci/apply_nabu_cpufreq.py ci/apply_nabu_gpu_dvfs.py ci/apply_disable_iconservices.py ci/apply_frame_timing.py nabu-source/scripts/nabu_display_bindings.py nabu-source/scripts/nabu_ui_watch_source.py nabu-source/source-ci/nabu_data_skeleton.py
          grep -F 'sheng-vsync' nabu-source/platform/NabuLegacyCpuPresent.cpp
          grep -F 'VSYNC_NOTIFY = 0xfffffff005cd9720' nabu-source/scripts/nabu_display_bindings.py
          test -z "$(git -C nabu-source diff --check)"

          for tree in unixnu-pass1 unixnu-final; do
            git init -q "$tree"
            git -C "$tree" remote add origin https://github.com/UniXNU/UniXNU.git
            git -C "$tree" fetch --quiet --depth 1 origin "$UNIXNU_SOURCE_SHA"
            git -C "$tree" checkout --quiet --detach FETCH_HEAD
            test "$(git -C "$tree" rev-parse HEAD)" = "$UNIXNU_SOURCE_SHA"
          done

          mkdir -p output pass1 nabu-pass1 nabu-final
          for stage in nabu-pass1 nabu-final; do
            cp nabu-source/source-ci/board-baseline.toml "$stage/board.toml"
            for entry in configs scripts patches platform ufs gpu usb userprobe vendor; do
              if [ -e "nabu-source/$entry" ]; then cp -a "nabu-source/$entry" "$stage/$entry"; fi
            done
          done

      - name: Fetch original iPadOS 17.7 build inputs
        run: |
          set -euxo pipefail
          python3 ci/download_ipados_inputs.py
          test -s "$UNIXNU_IPSW"
          unzip -t "$UNIXNU_IPSW" >/dev/null
          shasum -a 256 "$UNIXNU_IPSW" | tee output/ipsw-input-sha256.txt

      - name: Fetch and verify owner OS + SystemOS trust policies
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          mkdir -p owner-input/os owner-input/systemos owner-input/download
          gh release download owner-hash-policies-20261106             --repo "${{ github.repository }}"             --pattern '*-policy.tar.gz' --dir owner-input/download
          mv owner-input/download/os-policy.tar.gz owner-input/os-policy.tar.gz
          mv owner-input/download/systemos-policy.tar.gz owner-input/systemos-policy.tar.gz
          echo '762b971b49462cbaa99c0449a20a83edb9bbeec5bdbf07fbb07e6c3a2f9c5c14  owner-input/os-policy.tar.gz' | shasum -a 256 -c -
          echo '2fe6f4806ad4cb7a663321e0df781779cfbc825e296da88ecf26f5ebf8ee7b45  owner-input/systemos-policy.tar.gz' | shasum -a 256 -c -
          tar -xzf owner-input/os-policy.tar.gz -C owner-input/os
          tar -xzf owner-input/systemos-policy.tar.gz -C owner-input/systemos
          test -s owner-input/os/manifest.bin
          test -s owner-input/systemos/manifest.bin
          test -s owner-input/os/trusted-key.bin
          cmp owner-input/os/trusted-key.bin owner-input/systemos/trusted-key.bin
          test ! -e owner-input/os/private.pem
          test ! -e owner-input/systemos/private.pem
          echo "UNIXNU_OWNER_POLICY=$GITHUB_WORKSPACE/owner-input/os" >> "$GITHUB_ENV"
          echo "UNIXNU_OWNER_POLICY_SYSTEMOS=$GITHUB_WORKSPACE/owner-input/systemos" >> "$GITHUB_ENV"

      - name: Prepare pass 1 graphics-closure kernel
        if: inputs.reference_run == ''
        run: |
          set -euxo pipefail
          UNIXNU_DEVICE="$GITHUB_WORKSPACE/nabu-pass1"           python3 nabu-source/source-ci/prepare_source.py             --upstream "$GITHUB_WORKSPACE/unixnu-pass1"             --device "$GITHUB_WORKSPACE/nabu-pass1"             --profile nabu_ufs_cpu_ui_defconfig             --report "$GITHUB_WORKSPACE/output/pass1-source-prepare.json"

          python3 ci/rebase_owner_trust_patch.py             --patch "$GITHUB_WORKSPACE/nabu-pass1/patches/xnu/nabu-master-second-trust-cache.patch"
          python3 ci/merge_xnu_patches.py             --upstream "$GITHUB_WORKSPACE/unixnu-pass1/patches/xnu"             --device "$GITHUB_WORKSPACE/nabu-pass1/patches/xnu"             --report "$GITHUB_WORKSPACE/output/pass1-xnu-patch-manifest.json"             --owner-root

      - name: Build pass 1 reference kernel
        if: inputs.reference_run == ''
        run: |
          set -euxo pipefail
          export UNIXNU_DEVICE="$GITHUB_WORKSPACE/nabu-pass1"
          cd unixnu-pass1
          ./unixnu defconfig nabu_ufs_cpu_ui_defconfig -D "$GITHUB_WORKSPACE/nabu-pass1"
          ./unixnu build kernel --ipsw "$UNIXNU_IPSW" 2>&1 | tee "$GITHUB_WORKSPACE/output/pass1-kernel-build.log"
          cp out/nabu/kernel/kernel.macho "$GITHUB_WORKSPACE/pass1/kernel.macho"
          cp out/nabu/kernel/kernel.json "$GITHUB_WORKSPACE/pass1/kernel.json"
          test -s "$GITHUB_WORKSPACE/pass1/kernel.macho"
          python3 - <<'PY'
          import hashlib, json, os, pathlib
          base = pathlib.Path(os.environ["GITHUB_WORKSPACE"]) / "pass1"
          report = json.loads((base / "kernel.json").read_text())
          assert report["candidate_sha256"] == hashlib.sha256((base / "kernel.macho").read_bytes()).hexdigest(), "Pass 1 prelink identity mismatch"
          assert report["original_executable_sha256"], "Pass 1 component identities missing"
          PY
          shasum -a 256 "$GITHUB_WORKSPACE/pass1/kernel.macho" | tee "$GITHUB_WORKSPACE/output/pass1-kernel-sha256.txt"

      - name: Restore verified pass-one reference
        if: inputs.reference_run != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REF_RUN: ${{ inputs.reference_run }}
          REF_SHA: ${{ inputs.reference_sha256 }}
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          import os, re
          assert re.fullmatch(r"[0-9]+", os.environ["REF_RUN"])
          assert re.fullmatch(r"[0-9a-f]{64}", os.environ["REF_SHA"])
          PY
          gh run download "$REF_RUN" --repo "${{ github.repository }}" --name nabu-integrated-ui-build --dir reference-download
          cp reference-download/pass1/kernel.macho pass1/kernel.macho
          cp reference-download/pass1/kernel.json pass1/kernel.json
          python3 - <<'PY'
          import hashlib, json, os, pathlib
          root=pathlib.Path("reference-download")
          identity=json.loads((root/"output/integrated-build.json").read_text())
          assert identity["nabu_source"]==os.environ["NABU_SOURCE_SHA"]
          assert identity["unixnu_source"]==os.environ["UNIXNU_SOURCE_SHA"]
          assert hashlib.sha256(pathlib.Path("pass1/kernel.macho").read_bytes()).hexdigest()==os.environ["REF_SHA"]
          PY
          python3 ci/verify_display_reference.py --reference pass1/kernel.macho --candidate pass1/kernel.macho --report output/reused-reference-validation.json

      - name: Prepare final GPU + display kernel against pass 1 ABI
        run: |
          set -euxo pipefail
          export UNIXNU_DISPLAY_REFERENCE="$GITHUB_WORKSPACE/pass1/kernel.macho"
          git -C unixnu-final apply --check "$GITHUB_WORKSPACE/ci/nabu-standard-addon-diagnostics.patch"
          git -C unixnu-final apply "$GITHUB_WORKSPACE/ci/nabu-standard-addon-diagnostics.patch"
          python3 ci/apply_launchd_cache_mount.py --tree unixnu-final
          grep -F NABU_LAUNCHD_CACHE_V1 unixnu-final/patches/xnu/zzy-native-gpu-addon-mount.patch
          UNIXNU_DEVICE="$GITHUB_WORKSPACE/nabu-final"           python3 nabu-source/source-ci/prepare_source.py             --upstream "$GITHUB_WORKSPACE/unixnu-final"             --device "$GITHUB_WORKSPACE/nabu-final"             --profile nabu_ufs_gpu_metal_defconfig             --capture-logs --gpu-userprobe --ui-watch             --report "$GITHUB_WORKSPACE/output/final-source-prepare.json"

          # UniXNU 2c2e69f (f6e4012/47ec6a5): no-lc=1 skips AMFI launch constraints, which refuse WebKit's WebContent extension.
          cp "$GITHUB_WORKSPACE/ci/zzyc-owner-skip-launch-constraints.patch" "$GITHUB_WORKSPACE/unixnu-final/patches/xnu/"
          cp "$GITHUB_WORKSPACE/ci/zzzz-nabu-pmem-rpmh.patch" "$GITHUB_WORKSPACE/unixnu-final/patches/xnu/"
          python3 ci/rebase_owner_trust_patch.py             --patch "$GITHUB_WORKSPACE/nabu-final/patches/xnu/nabu-master-second-trust-cache.patch"
          python3 ci/merge_xnu_patches.py             --upstream "$GITHUB_WORKSPACE/unixnu-final/patches/xnu"             --device "$GITHUB_WORKSPACE/nabu-final/patches/xnu"             --report "$GITHUB_WORKSPACE/output/final-xnu-patch-manifest.json"             --owner-root

      - name: Restore required graphics startup code
        run: |
          set -euxo pipefail
          python3 ci/stage_graphics_startup.py --input unixnu-final/patches/xnu/offline-component-load-probes.patch --output nabu-final/patches/xnu/nabu-graphics-startup.patch

      - name: Build final integrated nabu kernel
        id: final_kernel
        run: |
          set -euxo pipefail
          export UNIXNU_DEVICE="$GITHUB_WORKSPACE/nabu-final"
          export UNIXNU_DISPLAY_REFERENCE="$GITHUB_WORKSPACE/pass1/kernel.macho"
          cd unixnu-final
          ./unixnu defconfig nabu_ufs_gpu_metal_defconfig -D "$GITHUB_WORKSPACE/nabu-final"
          ./unixnu build kernel --ipsw "$UNIXNU_IPSW" 2>&1 | tee "$GITHUB_WORKSPACE/output/final-kernel-build.log"

      - name: Reject stale display kernel
        run: |
          set -euxo pipefail
          K=unixnu-final/out/nabu/kernel/kernel.macho
          test -s "$K"
          python3 ci/verify_display_reference.py --reference pass1/kernel.macho --candidate "$K" --report output/final-display-reference-validation.json
          python3 ci/verify_xnu_macho.py --input "$K" --report output/final-kernel-identity.json
          python3 ci/verify_cpu_display_backend.py --input "$K" --report output/final-cpu-backend-validation.json
          shasum -a 256 "$K" | tee output/final-kernel-sha256.txt

      - name: Record integrated build identity
        if: always()
        env:
          BUILD_OUTCOME: ${{ steps.final_kernel.outcome }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          pathlib.Path('output/integrated-build.json').write_text(json.dumps({
            "nabu_source":"54b4f98457f8e9e232cc0a077c20d08d0b2f0ac9",
            "unixnu_source":"245aca1a9ec5b730b1cad80fade295800d2981f1",
            "pass1_profile":"nabu_ufs_cpu_ui_defconfig",
            "final_profile":"nabu_ufs_gpu_metal_defconfig",
            "final_outcome":os.getenv("BUILD_OUTCOME"),
            "display_reference":"pass1/kernel.macho",
            "owner_os_policy_sha256":"762b971b49462cbaa99c0449a20a83edb9bbeec5bdbf07fbb07e6c3a2f9c5c14",
            "owner_systemos_policy_sha256":"2fe6f4806ad4cb7a663321e0df781779cfbc825e296da88ecf26f5ebf8ee7b45",
            "device_flash_performed":False,
            "boot_verified":False
          }, indent=2)+"\n")
          PY

      - name: Show compiler errors from the full XNU logs
        if: failure()
        run: |
          for f in unixnu-final/out/nabu/logs/*.log pass1-logs/*.log; do
            [ -f "$f" ] || continue
            echo "== $f"; grep -n -B3 -A6 -E ' error: |error generated|errors generated|Undefined symbols' "$f" | head -120 || true
          done
          mkdir -p output/xnu-logs; cp unixnu-final/out/nabu/logs/*.log output/xnu-logs/ 2>/dev/null || true
      - name: Upload integrated kernel and build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nabu-integrated-ui-build
          path: |
            unixnu-final/out/nabu/kernel/kernel.macho
            unixnu-final/out/nabu/kernel/kernel.json
            pass1/kernel.macho
            pass1/kernel.json
            nabu-final/patches/xnu/nabu-graphics-startup.patch
            output/
          if-no-files-found: warn
          retention-days: 7
