name: Build nabu Metal frontend deadlock repairs
on:
  workflow_call:
permissions:
  contents: read
jobs:
  runtime:
    runs-on: macos-26-intel
    timeout-minutes: 60
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
      HOMEBREW_NO_ENV_HINTS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Select Xcode and install source toolchains
        run: |
          set -euo pipefail
          if [ -d /Applications/Xcode_26.6.app/Contents/Developer ]; then
            echo 'DEVELOPER_DIR=/Applications/Xcode_26.6.app/Contents/Developer' >> "$GITHUB_ENV"
            export DEVELOPER_DIR=/Applications/Xcode_26.6.app/Contents/Developer
          fi
          xcodebuild -version
          brew install llvm lld cmake ninja glslang pkg-config
          llvm_bin="$(brew --prefix llvm)/bin"
          echo "$llvm_bin" >> "$GITHUB_PATH"
          "$llvm_bin/llvm-as" --version
          rustup toolchain install 1.98.0 --profile minimal
          rustup target add --toolchain 1.98.0 aarch64-apple-ios
      - name: Fetch exact nabu source and combine independent frontend fixes
        run: |
          set -euo pipefail
          git init -q nabu-source
          git -C nabu-source remote add origin https://github.com/zzweiqing/UniXNU-nabu.git
          git -C nabu-source fetch --quiet --depth 1 origin 54b4f98457f8e9e232cc0a077c20d08d0b2f0ac9
          git -C nabu-source checkout --quiet --detach FETCH_HEAD
          test "$(git -C nabu-source rev-parse HEAD)" = 54b4f98457f8e9e232cc0a077c20d08d0b2f0ac9
          python3 ci/prepare_joint_metal_fix.py --device nabu-source
          python3 -m py_compile nabu-source/source-ci/nabu_metal_plugin_ci.py nabu-source/source-ci/nabu_turnip_ci.py
      - name: Build pinned Turnip and repaired Metal plugin; qualify async callbacks
        run: |
          set -euo pipefail
          mkdir -p output
          python3 nabu-source/source-ci/nabu_turnip_ci.py --device "$GITHUB_WORKSPACE/nabu-source" --work "$GITHUB_WORKSPACE/runtime-work" --output "$GITHUB_WORKSPACE/output/runtime" --plugin --async-fix --completion-fix 2>&1 | tee output/runtime-build.log
      - name: Qualify exact completion waits against callback and GPU execution cases
        run: |
          set -euo pipefail
          python3 ci/qualify_metal_completion_wait.py --baseline output/runtime/plugin/async-source/NativeBridgeMetalFrontend.baseline.mm --fixed output/runtime/plugin/async-source/NativeBridgeMetalFrontend.mm --output output/runtime/plugin/completion-qualification
      - name: Preserve signed deployment inputs and bind host evidence
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,pathlib,shutil
          base=pathlib.Path('output/runtime/plugin')
          report=json.loads((base/'plugin-report.json').read_text())
          assert report['bundle_built'] and report['plugin_returncode']==0
          assert report['async_fix'] is True and report['completion_fix'] is True
          assert report['async_creation']['passed']
          q=json.loads((base/'completion-qualification/report.json').read_text())
          assert q['passed']
          src=pathlib.Path('runtime-work/build/adreno-metal-plugin')
          dst=base/'deployment-inputs';dst.mkdir()
          names=('adrenoprobed','adrenoprobed-entitlements.plist','org.blu-sharky.adrenoprobed.plist','com.apple.iomfb_fdr_loader.plist','com.apple.bluetoothd.plist')
          files=[]
          for name in names:
              data=(src/name).read_bytes()
              assert hashlib.sha256(data).hexdigest()==report['undeployed'][name]
              shutil.copyfile(src/name,dst/name)
              files.append({'name':name,'sha256':hashlib.sha256(data).hexdigest(),'bytes':len(data)})
          receipt={'status':'JOINT_METAL_FRONTEND_HOST_PASS','async_cases':len(report['async_creation']['cases']),'completion_cases':len(q['cases']),'files':files,'hardware_tested':False,'boot_verified':False}
          (base/'joint-fix-host-report.json').write_text(json.dumps(receipt,indent=2)+'\n')
          print(receipt['status'],receipt['async_cases'],receipt['completion_cases'])
          PY
      - name: Upload runtime and bounded host evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nabu-metal-joint-fix
          retention-days: 7
          if-no-files-found: error
          path: |
            output/runtime-build.log
            output/runtime/
